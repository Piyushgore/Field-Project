<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>EMPOWERLIFE4U</title>
	<link rel="stylesheet" href="styles.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="icon" type="image/png" href="empower.jpg">
</head>

<body>
	<header class="header">
		<div class="logo">EMPOWERLIFE4U</div>
	</header>
	<main class="container">
		<!-- Step 1: Gender Selection -->
		<form id="genderForm" aria-labelledby="q1">
			<div id="q1" class="question">What's your gender?</div>
			<div class="options" role="radiogroup" aria-label="Gender">
				<label class="option" for="opt-male">
					<input class="radio" type="radio" name="gender" id="opt-male" value="male">
					<img src="male.png" alt="Male image placeholder">
					<div class="meta"><span class="label">Male</span></div>
				</label>

				<label class="option" for="opt-female">
					<input class="radio" type="radio" name="gender" id="opt-female" value="female">
					<img src="female.png" alt="Female image placeholder">
					<div class="meta"><span class="label">Female</span></div>
				</label>
			</div>

			<div class="next-row">
				<button type="submit" class="button">Next</button>
			</div>
		</form>

		<!-- Step 2: Height & Weight (hidden initially) -->
		<form id="metricsForm" class="hidden" aria-labelledby="q2">
			<div class="form-with-image">
				<div class="form-section">
					<div id="q2" class="question">Tell us about yourself</div>
					<div class="input-group">
						<label for="name">Full name</label>
						<input type="text" id="name" name="name" placeholder="e.g., John Doe" required>
					</div>
					<div class="input-group">
						<label for="age">Age (years)</label>
						<input type="number" id="age" name="age" placeholder="e.g., 25" min="0" max="150" step="1"
							required>
					</div>
					<div class="input-group">
						<label for="height">Height (cm)</label>
						<input type="number" id="height" name="height" placeholder="e.g., 170" min="0" step="1"
							required>
					</div>
					<div class="input-group">
						<label for="weight">Weight (kg)</label>
						<input type="number" id="weight" name="weight" placeholder="e.g., 70" min="0" step="0.1"
							required>
					</div>
				</div>
				<div class="image-section">
					<img id="genderImage" src="" alt="Selected gender image" class="gender-img">
				</div>
			</div>

			<div class="next-row">
				<button type="button" id="backBtn" class="button button-secondary">Back</button>
				<button type="submit" class="button">Submit</button>
			</div>
		</form>

		<!-- Step 3: BMI Results (hidden initially) -->
		<div id="bmiResults" class="hidden">
			<div id="q3" class="question">Your BMI Result</div>

			<div class="bmi-container">
				<!-- BMI Gauge with SVG -->
				<svg class="bmi-gauge" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
					<defs>
						<linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
							<stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
							<stop offset="33%" style="stop-color:#2ecc71;stop-opacity:1" />
							<stop offset="66%" style="stop-color:#f39c12;stop-opacity:1" />
							<stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
						</linearGradient>
					</defs>

					<!-- Half circle arc with gradient (Underweight -> Normal -> Overweight -> Obese) -->
					<path d="M 50 200 A 150 150 0 0 1 350 200" stroke="url(#gaugeGradient)" stroke-width="35"
						fill="none" stroke-linecap="round" />

					<!-- Center base for the arrow - same color as arrow (#333) -->
					<circle cx="200" cy="200" r="20" fill="#333" stroke="#222" stroke-width="2" />

					<!-- Animated Arrow (needle) - thicker -->
					<g id="bmiArrow">
						<line x1="200" y1="200" x2="200" y2="60" stroke="#333" stroke-width="8"
							stroke-linecap="round" />
						<polygon points="200,50 194,68 206,68" fill="#333" />
					</g>

					<!-- BMI Value display: placed slightly above the bottom labels inside the SVG -->
					<text id="bmiValueSvg" class="gauge-value-text" x="200" y="175">0.0</text>

					<!-- Category Labels positioned along the arc - larger and bolder -->
					<!-- Underweight (left side) -->
					<text id="lbl-underweight" class="gauge-label" x="85" y="135" fill="#3498db"></text>

					<!-- Normal (left-center) -->
					<text id="lbl-normal" class="gauge-label" x="130" y="60" fill="#2ecc71"></text>

					<!-- Overweight (right-center) -->
					<text id="lbl-overweight" class="gauge-label" x="270" y="60" fill="#f39c12"></text>

					<!-- Obese (right side) -->
					<text id="lbl-obese" class="gauge-label" x="315" y="135" fill="#e74c3c"></text>
				</svg>

				<!-- BMI Info -->
				<div class="bmi-info">
					<div id="bmiCategory" class="bmi-category">Category</div>
				</div>
			</div>

			<div class="next-row">
				<button type="button" id="backFromBmiBtn" class="button button-secondary">Back</button>
				<button type="button" id="nextBtn" class="button">Okay</button>
			</div>
		</div>

		<div id="mainPage" class="hidden">
			<!-- Placeholder for main page content after BMI results -->
		</div>
		<!-- Main Page (landing after OK) - blank placeholder for user code -->
	</main>
	<script src="script.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>

</html>
