<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpowerLife4U</title>
    <link rel="icon" type="image/png" href="empower.jpg">
    <style>
        body {
            background-color: black;
            color: #ccc;
        }

        #not-ready {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column
        }
        @media(max-width:600px) {
            #div1 {
                font-size: 2.5rem;
                margin-top: 10px;
                margin-bottom: 0;
            }

            #div2 {
                font-size: 2.5rem;
                margin-top: 0;
                margin-bottom: 5px;
            }

            #div3 {
                font-size: 0.5rem;
                letter-spacing: 0.25em;
                color:rgb(255, 174, 0);
            }
        }
        @media(min-width:1024px) {
            #div1 {
                font-size: 5rem;
                margin-top: 20px;
                margin-bottom: 0;
            }

            #div2 {
                font-size: 5rem;
                margin-top: 0;
                margin-bottom: 10px;
            }

            #div3 {
                font-size: 1rem;
                letter-spacing: 0.5em;
                color:rgb(255, 174, 0);
            }
        }
        #home{
            background-color:rgb(255,174,0);
            border-radius:2px;
            border:none;

        }
        a{
            text-decoration:none;
            color:white;
        }
    </style>
</head>
<body>
    <button id="home"><a href=main.html>Home</a></button>
    <section id="not-ready">
        <div id="div1">Under</div>
        <div id="div2">Construction</div>
        <div id="div3">SITE NEARLY READY</div>
    </section>
    <section class="progress-bar">
        <div id="white-bar"></div>
    </section>
</body>
</html>
